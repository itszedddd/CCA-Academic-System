services:
  - type: web
    name: cca-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
